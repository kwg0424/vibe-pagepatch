<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PagePatch · Claude</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="18" height="18">
    <strong>PagePatch</strong>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText"></span></span>
    <span class="grow"></span>
    <button class="btn ghost small" id="clearPreview" title="Claude 가 미리 적용한 CSS 를 지웁니다">미리보기 지우기</button>
    <button class="btn ghost small" id="newChat" title="새 대화">새 대화</button>
    <button type="button" class="icon-btn" id="openSettings" title="규칙 관리 · 설정"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <div class="tabline" id="tabline"></div>

  <div id="setup" class="setup hidden"></div>

  <main id="log">
    <div id="intro" class="intro">
      <p><b>지금 보고 있는 페이지를 Claude 와 함께 고칩니다.</b><br>
      <span class="muted small">Claude 가 먼저 화면에 바로 적용해서 보여 주고, "저장"이라고 하면 규칙으로 저장합니다.</span></p>
      <div class="chips">
        <button class="chip">광고·배너 숨겨줘</button>
        <button class="chip">본문 폭을 넓혀줘</button>
        <button class="chip">글자를 조금 더 크게</button>
        <button class="chip">이 페이지에 어떤 규칙이 있어?</button>
      </div>
    </div>
  </main>

  <footer>
    <textarea id="input" rows="2" placeholder="무엇을 바꿀까요? (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
    <button class="btn primary" id="send">보내기</button>
  </footer>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
