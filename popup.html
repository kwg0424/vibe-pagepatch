<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PagePatch</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="">
    <span class="title">PagePatch</span>
    <button type="button" id="settings" class="icon-btn" title="규칙 관리 · 설정"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <p class="host" id="host" hidden></p>

  <main id="main">
    <!-- 우클릭·복사 허용: 두 토글을 한 줄에 좌우로, 설명은 마우스를 올리면 -->
    <div id="unlock" hidden>
      <div class="u-toggles">
        <label class="u-toggle" title="우클릭 메뉴, 드래그 선택, 복사를 허용합니다">
          <b>우클릭 · 복사 허용</b>
          <input type="checkbox" id="uCopy">
        </label>
        <label class="u-toggle" title="기본으로 안 될 때만. 일부 기능이 깨질 수 있음">
          <b>강력 모드</b>
          <input type="checkbox" id="uStrong">
        </label>
      </div>
      <button type="button" id="uReload" class="accent" hidden>끄기 적용하려면 새로고침</button>
      <p id="uMsg" class="msg error" hidden></p>
    </div>
    <div id="list"></div>
    <p id="empty" class="empty" hidden>이 페이지에 적용되는 규칙이 없습니다.</p>
    <div class="actions">
      <button type="button" id="new" class="accent">사이트 규칙 추가</button>
      <button type="button" id="claude" class="accent" hidden>Claude 와 고치기</button>
    </div>
  </main>

  <p id="unsupported" class="empty" hidden>이 페이지에서는 사용할 수 없습니다.</p>
  <p id="userscripts" class="msg error" hidden>JS 규칙을 쓰려면 사용자 스크립트 허용이 필요합니다. <a href="#" id="howto">켜는 방법</a></p>

  <script src="popup.js" type="module"></script>
</body>
</html>
